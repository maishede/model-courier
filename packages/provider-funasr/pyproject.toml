[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-courier-provider-funasr"
version = "0.1.0.dev0"
requires-python = ">=3.11"
dependencies = ["model-courier>=0.1.0.dev0"]

[project.optional-dependencies]
runtime = ["funasr>=1.1,<2"]

[project.entry-points."model_courier.providers"]
funasr = "model_courier_provider_funasr.provider:registration"

[tool.setuptools.packages.find]
where = ["src"]
