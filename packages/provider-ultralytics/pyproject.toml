[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-courier-provider-ultralytics"
version = "0.1.0.dev0"
requires-python = ">=3.11"
dependencies = ["model-courier>=0.1.0.dev0"]

[project.optional-dependencies]
runtime = ["ultralytics>=8.3,<9"]

[project.entry-points."model_courier.providers"]
ultralytics = "model_courier_provider_ultralytics.provider:registration"

[tool.setuptools.packages.find]
where = ["src"]
