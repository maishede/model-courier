[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-courier-sdk"
version = "0.1.0"
description = "Small Python client for ModelCourier devices"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "model-courier>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
